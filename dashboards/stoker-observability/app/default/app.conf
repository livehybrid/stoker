# Stoker observability: dashboards over the control plane's dogfood telemetry
# (sourcetypes stoker:metrics and stoker:job). Install on the Splunk instance
# that receives the dogfood HEC stream (DOGFOOD_HEC_URL / DOGFOOD_HEC_TOKEN on
# the control plane).
[install]
is_configured = 0

[ui]
is_visible = 1
label = Stoker Observability

[launcher]
author = LiveHybrid
description = Live run + fleet observability over Stoker dogfood telemetry (delivered vs target eps, pacing lag, HEC outcomes, run lifecycle).
version = 1.0.0

[package]
id = stoker_observability
