# The control plane ships dogfood events as HEC JSON on two sourcetypes. Splunk
# does not JSON-extract a custom sourcetype by default, so the dashboards' SPL
# would not see run_id / eps / hec_* as fields. KV_MODE=json extracts them at
# search time (no re-indexing, safe to add to an existing index).
#
# TIME_PREFIX/TIMESTAMP: the HEC envelope carries its own "time" (epoch), which
# the HEC /event endpoint honours, so no timestamp config is needed here — this
# file exists solely for field extraction.

[stoker:metrics]
KV_MODE = json

[stoker:job]
KV_MODE = json
