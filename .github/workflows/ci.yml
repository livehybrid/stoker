name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/livehybrid/stoker-worker

# Concurrency is set per job, not once at workflow level, because the two halves
# of this pipeline want opposite behaviour.
#
# Test-shaped jobs are cancelled the moment a newer commit lands on the same PR
# or branch. A superseded test run tells you about code nobody will merge, so it
# is pure waste of Actions minutes.
#
# The publish chain (cp-build, build, smoke, sign) is not cancelled. Pushing a
# multi-arch manifest, smoking it and cosign-signing its digest is meant to be
# one atomic act, and a cancellation landing part-way through leaves an unsigned
# digest in the registry: it looks published, it pulls fine, and it fails
# verification. Those jobs get a group keyed on the commit SHA, which is unique
# per run anyway, with cancellation switched off.
#
# This is not a licence to build stale commits: every publish job is gated
# behind a test job, so when a newer push cancels the tests the publish behind
# them never starts.

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
          # PyYAML: the security_content resolver (tools/security_content_packs.py)
          # parses a security_content checkout; its tests skip without it.
          pip install pytest pytest-timeout pyyaml

      - name: Unit tests (agent)
        run: python -m pytest worker/tests -q

      - name: Unit tests (tools and packs)
        run: python -m pytest tools/tests -q --timeout=60

      # Real-engine checks run on 3.9 only (the image's runtime python).
      - name: Vendored engine import check
        id: engine
        if: matrix.python-version == '3.9'
        run: |
          if PYTHONPATH=worker/engines/eventgen python -c "import splunk_eventgen"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Real-engine smoke skipped::vendored splunk_eventgen failed to import on py3.9; fix the vendored tree before Phase 0 exit"
          fi

      - name: Standalone agent smoke (real engine, 5 s at 50 EPS)
        if: matrix.python-version == '3.9' && steps.engine.outputs.ok == '1'
        run: RATE=50 DURATION_S=5 TOLERANCE_PCT= tools/smoke.sh local

  server-test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r worker/requirements.txt
          pip install pytest pytest-timeout

      # Control-plane suite, including the real-worker end-to-end test that
      # drives the vendored agent subprocess through claim -> T0 -> final.
      - name: Control-plane tests
        run: python -m pytest server/tests -q --timeout=180

  ui-build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}-ui
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build the web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

  # Control-plane image: FastAPI + the built UI, multi-arch, signed.
  cp-build:
    needs: [server-test, ui-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-cp-${{ github.sha }}
      cancel-in-progress: false
    # Docker Hub push is opt-in: set repository secrets DOCKERHUB_USERNAME and
    # DOCKERHUB_TOKEN to also publish to docker.io/livehybrid/stoker. Absent
    # them, the build still succeeds and publishes to ghcr only (this env maps
    # the secret so a step `if:` can gate on it — secrets are not allowed in
    # `if` directly).
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # docker.io line is empty (ignored) unless Docker Hub is configured.
          images: |
            ghcr.io/livehybrid/stoker
            ${{ env.DOCKERHUB_USER != '' && 'docker.io/livehybrid/stoker' || '' }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Keyless sign the pushed digest (ghcr)
        run: cosign sign --yes "ghcr.io/livehybrid/stoker@${{ steps.push.outputs.digest }}"

      - name: Keyless sign the pushed digest (Docker Hub)
        if: env.DOCKERHUB_USER != ''
        run: cosign sign --yes "docker.io/livehybrid/stoker@${{ steps.push.outputs.digest }}"

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-worker-${{ github.sha }}
      cancel-in-progress: false
    # Docker Hub push is opt-in (see cp-build): with DOCKERHUB_USERNAME /
    # DOCKERHUB_TOKEN set, the worker image also publishes to
    # docker.io/livehybrid/stoker-worker; without them, ghcr only.
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USER != '' && 'docker.io/livehybrid/stoker-worker' || '' }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-worker-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed image (amd64)
        run: docker pull --platform linux/amd64 "${IMAGE_NAME}@${{ needs.build.outputs.digest }}"

      - name: Container smoke (20 s at 100 EPS, within 10 percent of 2000)
        run: RATE=100 DURATION_S=20 TOLERANCE_PCT=10 tools/smoke.sh docker "${IMAGE_NAME}@${{ needs.build.outputs.digest }}"

  sign:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-worker-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Keyless sign the pushed digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ needs.build.outputs.digest }}"
